<script>
const books={
"things-fall-apart":{title:"Things Fall Apart",author:"Chinua Achebe",country:"Nigeria",year:"1958",type:"Novel",themes:["Igbo society","Colonialism","Tradition","Identity"],summary:"Achebe follows Okonkwo, a respected Igbo warrior whose fierce determination to avoid weakness shapes both his achievements and his downfall. As British missionaries and colonial institutions enter Umuofia, the novel shows a community confronting profound political, religious and cultural change.",why:"The novel is one of the defining works of modern African literature because it places African society at the centre of its own story. It gives readers a layered picture of community life, authority, belief, family and the disruptions brought by colonial rule.",url:"https://www.penguinrandomhouse.com/books/669964/things-fall-apart-by-chinua-achebe-introduction-by-kwame-anthony-appiah/",source:"Publisher page / sample"},
"no-longer-at-ease":{title:"No Longer at Ease",author:"Chinua Achebe",country:"Nigeria",year:"1960",type:"Novel",themes:["Corruption","Modernity","Duty","Cultural conflict"],summary:"Obi Okonkwo returns to Nigeria after studying in England and begins work in the colonial civil service. His ideals are gradually tested by family expectations, financial pressure, social status and a system in which corruption is difficult to escape.",why:"The story shifts Achebe's African Trilogy into the late colonial period and examines what happens when a young educated Nigerian is caught between inherited obligations and a changing political order.",url:"https://www.penguinrandomhouse.com/books/409/no-longer-at-ease-by-chinua-achebe/9780385474559/",source:"Publisher page"},
"arrow-of-god":{title:"Arrow of God",author:"Chinua Achebe",country:"Nigeria",year:"1964",type:"Novel",themes:["Power","Religion","Authority","Colonial rule"],summary:"Set in an Igbo community under growing British colonial influence, the novel centres on Ezeulu, chief priest of Ulu. His struggle to protect religious authority becomes entangled with rivalry, pride and colonial intervention, with consequences for both himself and his people.",why:"The novel explores how political and spiritual authority can become fragile when internal conflict meets external colonial pressure.",url:"https://www.penguinrandomhouse.com/books/398/arrow-of-god-by-chinua-achebe/",source:"Publisher page / sample"},
"purple-hibiscus":{title:"Purple Hibiscus",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2003",type:"Novel",themes:["Family","Faith","Freedom","Coming of age"],summary:"Fifteen-year-old Kambili lives in a wealthy but tightly controlled household dominated by her deeply religious father. A visit to her aunt's freer and more expressive home exposes Kambili and her brother to a different way of living, loving and thinking.",why:"Adichie uses a family story to examine authoritarianism at home and in society, while tracing a young girl's gradual discovery of voice, independence and emotional freedom.",url:"https://www.chimamanda.com/purple-hibiscus/",source:"Official author page"},
"half-of-a-yellow-sun":{title:"Half of a Yellow Sun",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2006",type:"Novel",themes:["Biafra","War","Love","Class"],summary:"Through the intertwined lives of characters including Ugwu, Olanna and Richard, the novel follows the upheaval surrounding the creation of Biafra and the Nigerian Civil War. Personal loyalties, ideals and relationships are tested as political conflict becomes a struggle for survival.",why:"The novel combines intimate human relationships with a major episode of African history, making war visible through the lives of people who love, argue, hope and endure.",url:"https://www.chimamanda.com/half-of-a-yellow-sun/",source:"Official author page"},
"americanah":{title:"Americanah",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2013",type:"Novel",themes:["Migration","Race","Love","Belonging"],summary:"Ifemelu and Obinze leave Nigeria with different hopes for life abroad. Ifemelu builds a life in the United States and learns to navigate race in a new way, while Obinze faces an undocumented existence in Britain. Years later, both return to a changed Nigeria and confront what remains between them.",why:"The novel connects migration, race, class and romance while asking how leaving home changes the way people see themselves and the places they come from.",url:"https://www.chimamanda.com/americanah/",source:"Official author page"},
"dream-count":{title:"Dream Count",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2025",type:"Novel",themes:["Women","Love","Choice","Diaspora"],summary:"The novel follows four women whose lives intersect across Nigeria and the United States. Their experiences of love, ambition, motherhood, friendship, disappointment and self-examination reveal the different ways women try to build lives on their own terms.",why:"Adichie returns to long-form fiction with a story focused on women's interior lives, relationships and the difficult gap between the lives people imagine and the lives they actually inhabit.",url:"https://www.chimamanda.com/dream-count/",source:"Official author page"},
"weep-not-child":{title:"Weep Not, Child",author:"Ngũgĩ wa Thiong'o",country:"Kenya",year:"1964",type:"Novel",themes:["Education","Mau Mau","Family","Colonialism"],summary:"Njoroge believes education offers a path toward a better future, but his family is drawn into the violence and political tensions surrounding the Mau Mau uprising and British colonial rule in Kenya.",why:"The novel shows how large political struggles enter ordinary homes, shaping childhood, family loyalty and hopes for the future.",url:"https://www.penguinrandomhouse.com/books/310785/weep-not-child-by-ngugi-wa-thiongo-introduction-by-ben-okri-series-editor-chinua-achebe/ebook/",source:"Publisher page"},
"a-grain-of-wheat":{title:"A Grain of Wheat",author:"Ngũgĩ wa Thiong'o",country:"Kenya",year:"1967",type:"Novel",themes:["Independence","Betrayal","Memory","Community"],summary:"On the eve of Kenyan independence, villagers prepare to honour those who resisted colonial rule. Beneath the public celebration are private memories, betrayals and secrets, especially around the quiet Mugo, whom the community has turned into a symbol of heroism.",why:"The novel complicates simple ideas of heroes and traitors by showing how political liberation is also made from fear, compromise, guilt and personal sacrifice.",url:"https://www.penguinrandomhouse.com/books/309801/a-grain-of-wheat-by-ngugi-wa-thiongo/paperback/",source:"Publisher page"},
"petals-of-blood":{title:"Petals of Blood",author:"Ngũgĩ wa Thiong'o",country:"Kenya",year:"1977",type:"Novel",themes:["Inequality","Postcolonialism","Capitalism","Disillusionment"],summary:"A murder investigation frames the lives of four central characters connected to the village of Ilmorog. As the village is transformed by development and commerce, the novel examines how promises of independence can be undermined by inequality and exploitation.",why:"Ngũgĩ turns from colonial domination to the disappointments of post-independence society, asking who benefits when a nation develops economically but leaves many people behind.",url:"https://www.penguinrandomhouse.com/books/295517/petals-of-blood-by-ngugi-wa-thiongo-introduction-by-moses-isegawa-series-editor-chinua-achebe/ebook/",source:"Publisher page / sample"},
"kintu":{title:"Kintu",author:"Jennifer Nansubuga Makumbi",country:"Uganda",year:"2014 / later international editions",type:"Novel",themes:["Buganda","Family","Myth","Inheritance"],summary:"Beginning in the Buganda Kingdom in 1750, Kintu follows the consequences of a curse that moves through one family across generations. Makumbi blends Ganda oral tradition, history, myth and contemporary Ugandan life into a wide-ranging family saga.",why:"The novel offers an ambitious Ugandan-centred historical imagination, connecting the distant past with present-day family identity and questions of inheritance.",url:"https://www.simonandschuster.co.uk/books/Kintu/Jennifer-Nansubuga-Makumbi/9781786073785",source:"Official publisher page"},
"manchester-happened":{title:"Manchester Happened",author:"Jennifer Nansubuga Makumbi",country:"Uganda",year:"2019",type:"Short-story collection",themes:["Migration","Home","Diaspora","Belonging"],summary:"This collection moves between Uganda and Britain, following Ugandans who migrate, settle, return, remember and reconsider what home means. The stories combine humour, cultural tension and emotional complexity.",why:"Makumbi treats migration not simply as leaving one place for another, but as an ongoing negotiation between language, family, identity and expectations.",url:"https://www.simonandschuster.co.uk/books/Manchester-Happened/Jennifer-Nansubuga-Makumbi/9781786075918",source:"Official publisher page"},
"the-first-woman":{title:"The First Woman",author:"Jennifer Nansubuga Makumbi",country:"Uganda",year:"2020",type:"Novel",themes:["Girlhood","Gender","Folklore","Identity"],summary:"Kirabo grows up in Uganda surrounded by family but troubled by questions about her absent mother and about what it means to become a woman. Her search for answers draws together family secrets, folklore, friendship and competing ideas about women's power.",why:"The novel combines a coming-of-age story with Ugandan history and storytelling traditions, giving special attention to how girls learn the rules that society places around womanhood.",url:"https://www.simonandschuster.co.uk/books/The-First-Woman/Jennifer-Nansubuga-Makumbi/9781786077899",source:"Official publisher page"},
"waiting":{title:"Waiting",author:"Goretti Kyomuhendo",country:"Uganda",year:"2007",type:"Novel",themes:["Idi Amin era","War","Family","Survival"],summary:"During the final period of Idi Amin's rule, teenager Alinda and her family live in a rural Ugandan community that can no longer remain distant from the violence. As soldiers retreat and conflict moves closer, the family faces fear, hunger, displacement and uncertainty.",why:"Kyomuhendo tells national history through a young woman's experience, focusing on how political violence changes everyday life inside a family and village.",url:"https://www.feministpress.org/news/african-and-haitian-authors",source:"Publisher listing"},
"whispers-from-vera":{title:"Whispers from Vera",author:"Goretti Kyomuhendo",country:"Uganda",year:"2000s / later editions",type:"Novel",themes:["Kampala","Marriage","Career","Modern womanhood"],summary:"Vera is an ambitious professional woman in Kampala who wants love, marriage, family and a successful career. When she meets Eric, the relationship seems promising until a major secret forces her to reassess what she wants and what she is willing to accept.",why:"The novel offers a lively portrait of middle-class urban Ugandan womanhood, using romance and humour to explore relationships, social expectations and independence.",url:"https://mvuapress.com/books/whispers-from-vera",source:"Publisher page"},
"promises":{title:"Promises",author:"Goretti Kyomuhendo",country:"Uganda",year:"2025",type:"Novel",themes:["Migration","Love","Kampala","London"],summary:"Ajuna and Kagaba are a young Ugandan couple facing financial pressure. When Kagaba migrates to Britain, distance, legal insecurity and difficult living conditions strain their relationship, while both confront the promises people make to each other and to themselves.",why:"The novel connects Ugandan family life with the realities of economic migration, asking what happens to love and loyalty when survival requires separation and compromise.",url:"https://www.catalystpress.org/all-content/promises",source:"Official publisher page"},
"tropical-fish":{title:"Tropical Fish",author:"Doreen Baingana",country:"Uganda",year:"2005 / 2006 editions",type:"Linked stories",themes:["Entebbe","Girlhood","Migration","Family"],summary:"Through Christine Mugisha and her sisters, Baingana follows a Ugandan family through adolescence, faith, relationships, loss and migration. The stories move from Entebbe and Kampala to the United States and back again.",why:"The collection gives readers an intimate coming-of-age portrait of Ugandan girls and women while exploring the complicated meanings of home, culture and belonging.",url:"https://www.penguinrandomhouse.com/books/7338/tropical-fish-by-doreen-baingana/",source:"Publisher page / sample"}
};
