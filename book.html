.reader-overlay{position:fixed;inset:0;z-index:5000;background:#0b0b0b;display:none;flex-direction:column}.reader-overlay.open{display:flex}.reader-top{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 20px;border-bottom:1px solid #242424;background:#101010}.reader-title{min-width:0}.reader-title strong{display:block;font-family:"Playfair Display",serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reader-title span{display:block;color:#777;font-size:.62rem}.reader-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid #333;background:#171717;color:#fff;display:grid;place-items:center;cursor:pointer}.icon-btn:hover{border-color:var(--gold);color:var(--gold)}.reader-progress{height:3px;background:#1f1f1f}.reader-progress span{display:block;height:100%;width:0;background:var(--gold);transition:.25s}.reader-main{flex:1;min-height:0;overflow:auto;padding:34px 18px 28px;background:radial-gradient(circle at 50% 0,rgba(216,172,86,.05),transparent 40%)}.paper{width:min(760px,100%);min-height:calc(100vh - 170px);margin:auto;background:var(--paper);color:var(--ink);border-radius:12px;padding:clamp(30px,5vw,62px);box-shadow:0 30px 90px rgba(0,0,0,.45);position:relative}.page-number{position:absolute;top:20px;right:24px;color:#9a8d7c;font-size:.68rem}.paper .chapter-label{text-transform:uppercase;letter-spacing:2.5px;color:#9c7438;font-size:.67rem;font-weight:800;margin-bottom:15px}.paper h2{font-family:"Playfair Display",serif;font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.04;margin-bottom:25px}.paper p{font-family:"Playfair Display",serif;font-size:var(--reader-font,1.23rem);line-height:1.92;margin-bottom:20px}.paper ul{padding-left:22px}.paper li{font-family:"Playfair Display",serif;font-size:var(--reader-font,1.23rem);line-height:1.8;margin-bottom:10px}.reader-bottom{min-height:72px;display:flex;align-items:center;justify-content:center;gap:12 <script>
const books={
"things-fall-apart":{title:"Things Fall Apart",author:"Chinua Achebe",country:"Nigeria",year:"1958",type:"Novel",themes:["Igbo society","Colonialism","Tradition","Identity"],summary:"Achebe follows Okonkwo, a respected Igbo warrior whose fierce determination to avoid weakness shapes both his achievements and his downfall. As British missionaries and colonial institutions enter Umuofia, the novel shows a community confronting profound political, religious and cultural change.",why:"The novel is one of the defining works of modern African literature because it places African society at the centre of its own story. It gives readers a layered picture of community life, authority, belief, family and the disruptions brought by colonial rule.",context:"The story is set in Igbo communities in what is now southeastern Nigeria, at a time when British colonial rule and Christian missionary activity were reshaping political and religious life.",url:"https://www.penguinrandomhouse.com/books/669964/things-fall-apart-by-chinua-achebe-introduction-by-kwame-anthony-appiah/",source:"Publisher page / sample"},
"no-longer-at-ease":{title:"No Longer at Ease",author:"Chinua Achebe",country:"Nigeria",year:"1960",type:"Novel",themes:["Corruption","Modernity","Duty","Cultural conflict"],summary:"Obi Okonkwo returns to Nigeria after studying in England and begins work in the colonial civil service. His ideals are gradually tested by family expectations, financial pressure, social status and a system in which corruption is difficult to escape.",why:"The story shifts Achebe's African Trilogy into the late colonial period and examines what happens when a young educated Nigerian is caught between inherited obligations and a changing political order.",context:"The novel takes place near the end of British colonial rule in Nigeria and explores the tensions experienced by a new educated African elite.",url:"https://www.penguinrandomhouse.com/books/409/no-longer-at-ease-by-chinua-achebe/9780385474559/",source:"Publisher page"},
"arrow-of-god":{title:"Arrow of God",author:"Chinua Achebe",country:"Nigeria",year:"1964",type:"Novel",themes:["Power","Religion","Authority","Colonial rule"],summary:"Set in an Igbo community under growing British colonial influence, the novel centres on Ezeulu, chief priest of Ulu. His struggle to protect religious authority becomes entangled with rivalry, pride and colonial intervention, with consequences for both himself and his people.",why:"The novel explores how political and spiritual authority can become fragile when internal conflict meets external colonial pressure.",context:"Achebe places the conflict at a moment when local institutions and British colonial administration overlap, compete and misunderstand one another.",url:"https://www.penguinrandomhouse.com/books/398/arrow-of-god-by-chinua-achebe/",source:"Publisher page / sample"},
"purple-hibiscus":{title:"Purple Hibiscus",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2003",type:"Novel",themes:["Family","Faith","Freedom","Coming of age"],summary:"Fifteen-year-old Kambili lives in a wealthy but tightly controlled household dominated by her deeply religious father. A visit to her aunt's freer and more expressive home exposes Kambili and her brother to a different way of living, loving and thinking.",why:"Adichie uses a family story to examine authoritarianism at home and in society, while tracing a young girl's gradual discovery of voice, independence and emotional freedom.",context:"The novel is set in Nigeria during a period of political instability and military rule, linking public repression with private control inside the family.",url:"https://www.chimamanda.com/purple-hibiscus/",source:"Official author page"},
"half-of-a-yellow-sun":{title:"Half of a Yellow Sun",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2006",type:"Novel",themes:["Biafra","War","Love","Class"],summary:"Through the intertwined lives of characters including Ugwu, Olanna and Richard, the novel follows the upheaval surrounding the creation of Biafra and the Nigerian Civil War. Personal loyalties, ideals and relationships are tested as political conflict becomes a struggle for survival.",why:"The novel combines intimate human relationships with a major episode of African history, making war visible through the lives of people who love, argue, hope and endure.",context:"The story centres on the Biafran secession and Nigerian Civil War of 1967–1970, a conflict that caused enormous suffering and displacement.",url:"https://www.chimamanda.com/half-of-a-yellow-sun/",source:"Official author page"},
"americanah":{title:"Americanah",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2013",type:"Novel",themes:["Migration","Race","Love","Belonging"],summary:"Ifemelu and Obinze leave Nigeria with different hopes for life abroad. Ifemelu builds a life in the United States and learns to navigate race in a new way, while Obinze faces an undocumented existence in Britain. Years later, both return to a changed Nigeria and confront what remains between them.",why:"The novel connects migration, race, class and romance while asking how leaving home changes the way people see themselves and the places they come from.",context:"The book moves between Nigeria, the United States and Britain, examining how identity changes across borders and social systems.",url:"https://www.chimamanda.com/americanah/",source:"Official author page"},
"dream-count":{title:"Dream Count",author:"Chimamanda Ngozi Adichie",country:"Nigeria",year:"2025",type:"Novel",themes:["Women","Love","Choice","Diaspora"],summary:"The novel follows four women whose lives intersect across Nigeria and the United States. Their experiences of love, ambition, motherhood, friendship, disappointment and self-examination reveal the different ways women try to build lives on their own terms.",why:"Adichie returns to long-form fiction with a story focused on women's interior lives, relationships and the difficult gap between the lives people imagine and the lives they actually inhabit.",context:"The narrative moves across contemporary Nigerian and diasporic settings and concentrates on adult friendship, desire, memory and self-definition.",url:"https://www.chimamanda.com/dream-count/",source:"Official author page"},
"weep-not-child":{title:"Weep Not, Child",author:"Ngũgĩ wa Thiong'o",country:"Kenya",year:"1964",type:"Novel",themes:["Education","Mau Mau","Family","Colonialism"],summary:"Njoroge believes education offers a path toward a better future, but his family is drawn into the violence and political tensions surrounding the Mau Mau uprising and British colonial rule in Kenya.",why:"The novel shows how large political struggles enter ordinary homes, shaping childhood, family loyalty and hopes for the future.",context:"The story is rooted in colonial Kenya during the Mau Mau Emergency, when land, political rights and resistance were central national questions.",url:"https://www.penguinrandomhouse.com/books/310785/weep-not-child-by-ngugi-wa-thiongo-introduction-by-ben-okri-series-editor-chinua-achebe/ebook/",source:"Publisher page"},
"a-grain-of-wheat":{title:"A Grain of Wheat",author:"Ngũgĩ wa Thiong'o",country:"Kenya",year:"1967",type:"Novel",themes:["Independence","Betrayal","Memory","Community"],summary:"On the eve of Kenyan independence, villagers prepare to honour those who resisted colonial rule. Beneath the public celebration are private memories, betrayals and secrets, especially around the quiet Mugo, whom the community has turned into a symbol of heroism.",why:"The novel complicates simple ideas of heroes and traitors by showing how political liberation is also made from fear, compromise, guilt and personal sacrifice.",context:"The narrative looks back at the anti-colonial struggle from the threshold of independence, allowing personal memory and national history to collide.",url:"https://www.penguinrandomhouse.com/books/309801/a-grain-of-wheat-by-ngugi-wa-thiongo/paperback/",source:"Publisher page"},
"petals-of-blood":{title:"Petals of Blood",author:"Ngũgĩ wa Thiong'o",country:"Kenya",year:"1977",type:"Novel",themes:["Inequality","Postcolonialism","Capitalism","Disillusionment"],summary:"A murder investigation frames the lives of four central characters connected to the village of Ilmorog. As the village is transformed by development and commerce, the novel examines how promises of independence can be undermined by inequality and exploitation.",why:"Ngũgĩ turns from colonial domination to the disappointments of post-independence society, asking who benefits when a nation develops economically but leaves many people behind.",context:"The novel reflects debates in post-independence Kenya about class, land, capitalism, political power and the meaning of national liberation.",url:"https://www.penguinrandomhouse.com/books/295517/petals-of-blood-by-ngugi-wa-thiongo-introduction-by-moses-isegawa-series-editor-chinua-achebe/ebook/",source:"Publisher page / sample"},
"kintu":{title:"Kintu",author:"Jennifer Nansubuga Makumbi",country:"Uganda",year:"2014 / later international editions",type:"Novel",themes:["Buganda","Family","Myth","Inheritance"],summary:"Beginning in the Buganda Kingdom in 1750, Kintu follows the consequences of a curse that moves through one family across generations. Makumbi blends Ganda oral tradition, history, myth and contemporary Ugandan life into a wide-ranging family saga.",why:"The novel offers an ambitious Ugandan-centred historical imagination, connecting the distant past with present-day family identity and questions of inheritance.",context:"The story stretches from precolonial Buganda into contemporary Uganda, making history a living force inside family relationships and cultural memory.",url:"https://www.simonandschuster.co.uk/books/Kintu/Jennifer-Nansubuga-Makumbi/9781786073785",source:"Official publisher page"},
"manchester-happened":{title:"Manchester Happened",author:"Jennifer Nansubuga Makumbi",country:"Uganda",year:"2019",type:"Short-story collection",themes:["Migration","Home","Diaspora","Belonging"],summary:"This collection moves between Uganda and Britain, following Ugandans who migrate, settle, return, remember and reconsider what home means. The stories combine humour, cultural tension and emotional complexity.",why:"Makumbi treats migration not simply as leaving one place for another, but as an ongoing negotiation between language, family, identity and expectations.",context:"The collection draws on Ugandan and British settings to explore the emotional and practical realities of diaspora life.",url:"https://www.simonandschuster.co.uk/books/Manchester-Happened/Jennifer-Nansubuga-Makumbi/9781786075918",source:"Official publisher page"},
"the-first-woman":{title:"The First Woman",author:"Jennifer Nansubuga Makumbi",country:"Uganda",year:"2020",type:"Novel",themes:["Girlhood","Gender","Folklore","Identity"],summary:"Kirabo grows up in Uganda surrounded by family but troubled by questions about her absent mother and about what it means to become a woman. Her search for answers draws together family secrets, folklore, friendship and competing ideas about women's power.",why:"The novel combines a coming-of-age story with Ugandan history and storytelling traditions, giving special attention to how girls learn the rules that society places around womanhood.",context:"The novel is rooted in Ugandan family and village life and draws on storytelling traditions to examine gender, adolescence and identity.",url:"https://www.simonandschuster.co.uk/books/The-First-Woman/Jennifer-Nansubuga-Makumbi/9781786077899",source:"Official publisher page"},
"waiting":{title:"Waiting",author:"Goretti Kyomuhendo",country:"Uganda",year:"2007",type:"Novel",themes:["Idi Amin era","War","Family","Survival"],summary:"During the final period of Idi Amin's rule, teenager Alinda and her family live in a rural Ugandan community that can no longer remain distant from the violence. As soldiers retreat and conflict moves closer, the family faces fear, hunger, displacement and uncertainty.",why:"Kyomuhendo tells national history through a young woman's experience, focusing on how political violence changes everyday life inside a family and village.",context:"The novel is set around the collapse of Idi Amin's regime, when war and political violence affected communities across Uganda.",url:"https://www.feministpress.org/news/african-and-haitian-authors",source:"Publisher listing"},
"whispers-from-vera":{title:"Whispers from Vera",author:"Goretti Kyomuhendo",country:"Uganda",year:"2000s / later editions",type:"Novel",themes:["Kampala","Marriage","Career","Modern womanhood"],summary:"Vera is an ambitious professional woman in Kampala who wants love, marriage, family and a successful career. When she meets Eric, the relationship seems promising until a major secret forces her to reassess what she wants and what she is willing to accept.",why:"The novel offers a lively portrait of middle-class urban Ugandan womanhood, using romance and humour to explore relationships, social expectations and independence.",context:"Set largely in urban Uganda, the book looks at the pressures and possibilities facing educated professional women in contemporary society.",url:"https://mvuapress.com/books/whispers-from-vera",source:"Publisher page"},
"promises":{title:"Promises",author:"Goretti Kyomuhendo",country:"Uganda",year:"2025",type:"Novel",themes:["Migration","Love","Kampala","London"],summary:"Ajuna and Kagaba are a young Ugandan couple facing financial pressure. When Kagaba migrates to Britain, distance, legal insecurity and difficult living conditions strain their relationship, while both confront the promises people make to each other and to themselves.",why:"The novel connects Ugandan family life with the realities of economic migration, asking what happens to love and loyalty when survival requires separation and compromise.",context:"The story moves between Uganda and Britain and reflects contemporary concerns about migration, money, documentation and family separation.",url:"https://www.catalystpress.org/all-content/promises",source:"Official publisher page"},
"tropical-fish":{title:"Tropical Fish",author:"Doreen Baingana",country:"Uganda",year:"2005 / 2006 editions",type:"Linked stories",themes:["Entebbe","Girlhood","Migration","Family"],summary:"Through Christine Mugisha and her sisters, Baingana follows a Ugandan family through adolescence, faith, relationships, loss and migration. The stories move from Entebbe and Kampala to the United States and back again.",why:"The collection gives readers an intimate coming-of-age portrait of Ugandan girls and women while exploring the complicated meanings of home, culture and belonging.",context:"The linked stories move through Ugandan and American settings, following the changes in identity that come with age, travel and return.",url:"https://www.penguinrandomhouse.com/books/7338/tropical-fish-by-doreen-baingana/",source:"Publisher page / sample"}
};
const app=document.getElementById('app');
const id=new URLSearchParams(location.search).get('book');
const b=books[id];
const reader=document.getElementById('reader');
const paper=document.getElementById('paper');
const readerMain=document.getElementById('readerMain');
const pageStatus=document.getElementById('pageStatus');
const progressBar=document.getElementById('progressBar');
const prevBtn=document.getElementById('prevPage');
const nextBtn=document.getElementById('nextPage');
const bookmarkBtn=document.getElementById('bookmarkBtn');
let pageIndex=0;
let fontSize=1.23;
let pages=[];
function makePages(book){return[
{label:"Reader introduction",title:book.title,html:`<p><strong>${book.title}</strong> is a ${book.type.toLowerCase()} by ${book.author}. This reader gives you an original guide to the story, its setting, themes and importance before you continue to an authorized source for the complete work.</p><p>Use the arrows below to move through the guide like a small digital book.</p>`},
{label:"Page 2 · Story overview",title:"What happens in the story?",html:`<p>${book.summary}</p>`},
{label:"Page 3 · Context",title:"Where the story sits",html:`<p>${book.context}</p><p>Understanding this background helps the reader see why the characters' choices and conflicts carry meaning beyond their private lives.</p>`},
{label:"Page 4 · Interpretation",title:"Why this book matters",html:`<p>${book.why}</p>`},
{label:"Page 5 · Themes",title:"Ideas to watch while reading",html:`<ul>${book.themes.map(t=>`<li><strong>${t}</strong> — notice how this idea shapes characters, conflict and the meaning of the story.</li>`).join('')}</ul>`},
{label:"Page 6 · Continue",title:"Read the authorized book",html:`<p>You have reached the end of the Kitsamba Writes Africa guide for <strong>${book.title}</strong>.</p><p>The complete text is copyrighted, so it is not reproduced here. Continue through the author's or publisher's authorized page to find purchase options, ebook editions or official samples where available.</p><p><a class="btn primary" target="_blank" rel="noopener" href="${book.url}"><i class="fa-solid fa-book-open"></i> ${book.source}</a></p>`}
]}
function renderPage(){const p=pages[pageIndex];paper.innerHTML=`<div class="page-number">${pageIndex+1}</div><div class="chapter-label">${p.label}</div><h2>${p.title}</h2>${p.html}`;paper.style.setProperty('--reader-font',fontSize+'rem');pageStatus.textContent=`${pageIndex+1} / ${pages.length}`;progressBar.style.width=((pageIndex+1)/pages.length*100)+'%';prevBtn.disabled=pageIndex===0;prevBtn.style.opacity=pageIndex===0?'.4':'1';nextBtn.innerHTML=pageIndex===pages.length-1?'Close Reader <i class="fa-solid fa-xmark"></i>':'Next <i class="fa-solid fa-arrow-right"></i>';readerMain.scrollTop=0;const saved=Number(localStorage.getItem('kwa-bookmark-'+id));bookmarkBtn.classList.toggle('bookmark-active',saved===pageIndex);bookmarkBtn.querySelector('i').className=saved===pageIndex?'fa-solid fa-bookmark':'fa-regular fa-bookmark'}
function openReader(){reader.classList.add('open');document.body.style.overflow='hidden';const saved=Number(localStorage.getItem('kwa-bookmark-'+id));if(Number.isInteger(saved)&&saved>=0&&saved<pages.length)pageIndex=saved;renderPage()}
function closeReader(){reader.classList.remove('open');document.body.style.overflow=''}
if(!b){app.innerHTML=`<section class="error"><div class="container"><i class="fa-solid fa-book-open"></i><h1>Book not found</h1><p>The book link may be incomplete. Return to the Authors & Books page and choose a title again.</p><a class="btn primary" href="authors.html">Back to Authors & Books</a></div></section>`}
else{document.title=`${b.title} | Kitsamba Writes Africa`;pages=makePages(b);document.getElementById('readerBookTitle').textContent=b.title;document.getElementById('readerAuthor').textContent=b.author;app.innerHTML=`<section class="hero"><div class="container"><div class="hero-grid"><div class="cover"><small>${b.country} · ${b.type}</small><h2>${b.title}</h2><p>${b.author}</p></div><div><div class="eyebrow">Kitsamba Writes Africa · Reader edition</div><h1>${b.title}</h1><div class="meta"><span><i class="fa-solid fa-user-pen"></i> ${b.author}</span><span><i class="fa-solid fa-location-dot"></i> ${b.country}</span><span><i class="fa-solid fa-calendar"></i> ${b.year}</span><span><i class="fa-solid fa-book"></i> ${b.type}</span></div><p class="intro">${b.summary}</p><div class="actions"><button class="btn primary" id="openReader"><i class="fa-solid fa-book-open-reader"></i> Open Book</button><a class="btn secondary" target="_blank" rel="noopener" href="${b.url}"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${b.source}</a></div></div></div></div></section><section class="info"><div class="container"><div class="info-grid"><div><div class="eyebrow">Before you read</div><h2>About this reader</h2><p>The Open Book reader gives you a page-by-page introduction to the story, context, major themes and why the work matters. It is designed for discovery, revision and deciding what to read next.</p><div class="themes">${b.themes.map(t=>`<span class="theme">${t}</span>`).join('')}</div></div><aside class="side-card"><div class="eyebrow">Reading options</div><h3>Start inside Kitsamba Writes</h3><p>Your bookmark is saved automatically in this browser, so you can return to the same guide page later.</p><button class="btn primary" id="openReader2"><i class="fa-solid fa-book-open-reader"></i> Open Book</button><a class="btn secondary" target="_blank" rel="noopener" href="${b.url}"><i class="fa-solid fa-book"></i> Authorized Source</a></aside></div></div></section>`;document.getElementById('openReader').addEventListener('click',openReader);document.getElementById('openReader2').addEventListener('click',openReader)}
document.getElementById('closeReader').addEventListener('click',closeReader);prevBtn.addEventListener('click',()=>{if(pageIndex>0){pageIndex--;renderPage()}});nextBtn.addEventListener('click',()=>{if(pageIndex<pages.length-1){pageIndex++;renderPage()}else closeReader()});document.getElementById('fontUp').addEventListener('click',()=>{fontSize=Math.min(1.65,fontSize+.1);renderPage()});document.getElementById('fontDown').addEventListener('click',()=>{fontSize=Math.max(.95,fontSize-.1);renderPage()});bookmarkBtn.addEventListener('click',()=>{localStorage.setItem('kwa-bookmark-'+id,pageIndex);renderPage()});document.addEventListener('keydown',e=>{if(!reader.classList.contains('open'))return;if(e.key==='Escape')closeReader();if(e.key==='ArrowRight'&&pageIndex<pages.length-1){pageIndex++;renderPage()}if(e.key==='ArrowLeft'&&pageIndex>0){pageIndex--;renderPage()}});
</script>
</body>
</html>
